server {
    listen 5173;
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    send_timeout 120s;

    # SPA fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API through the same origin/port.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Опубликованные HTML — с диска (общий volume с backend), без прокси на API.
    location /reports/ {
        alias /data/storage/reports/;
        default_type text/html;
        charset utf-8;
        gzip_static off;
    }

    location = /plotly-2.35.2.min.js {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files /plotly-2.35.2.min.js =404;
    }

    location /indicator-media/ {
        alias /data/storage/indicator_tg/;
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML-саммари TG-анализа конкурентов (общий volume с backend)
    location /competitor-summaries/ {
        alias /data/storage/competitor_summaries/;
        default_type text/html;
        charset utf-8;
        gzip_static off;
        add_header Cache-Control "public, max-age=60";
    }

    # Cache static assets aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
