# Ротация логов контейнеров (json-file): не даёт /var/lib/docker разрастись без ограничений.
# По умолчанию ~100 МБ на сервис (5 файлов × 20 МБ). Настройка: DOCKER_LOG_MAX_SIZE, DOCKER_LOG_MAX_FILE в .env
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

# Один образ для backend / migrate / worker — иначе после `build backend` migrate остаётся без новых alembic-ревизий.
x-backend-image: &backend-image
  image: newsint-backend
  build:
    context: ./backend

services:
  db:
    logging: *default-logging
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_DB: newsint
      POSTGRES_USER: newsint
      POSTGRES_PASSWORD: newsint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsint -d newsint"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    logging: *default-logging
    restart: unless-stopped
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend-image
    logging: *default-logging
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://newsint:newsint@db:5432/newsint}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-change-me}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      TELEGRAM_SESSION_DIR: ${TELEGRAM_SESSION_DIR:-/data/tg}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api.max.ru}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      VK_API_BASE: ${VK_API_BASE:-https://api.vk.com/method}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
    command: ["sh", "-lc", "alembic upgrade head"]
    volumes:
      - storage:/data/storage
      - tgdata:/data/tg
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-image
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://newsint:newsint@db:5432/newsint}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-change-me}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-30}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      # Comma-separated list is supported by backend settings parsing.
      # Configure via `.env` next to this compose file:
      # - PUBLIC_HOST=your.domain_or_ip
      # - or set UI_ORIGIN / API_PUBLIC_URL explicitly
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://${PUBLIC_HOST:-localhost}:5173}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      TELEGRAM_SESSION_DIR: ${TELEGRAM_SESSION_DIR:-/data/tg}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api.max.ru}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      VK_API_BASE: ${VK_API_BASE:-https://api.vk.com/method}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
      - tgdata:/data/tg
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend-image
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://newsint:newsint@db:5432/newsint}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-change-me}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
      TELEGRAM_SESSION_DIR: ${TELEGRAM_SESSION_DIR:-/data/tg}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api.max.ru}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      VK_API_BASE: ${VK_API_BASE:-https://api.vk.com/method}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
    # NOTE: use $$ to escape Compose variable interpolation; let shell expand inside container
    command: ["sh", "-lc", "rq worker -u $$REDIS_URL default"]
    volumes:
      - storage:/data/storage
      - tgdata:/data/tg
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  tg-auth:
    <<: *backend-image
    logging: *default-logging
    profiles:
      - manual
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://newsint:newsint@db:5432/newsint}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-change-me}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api.max.ru}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      VK_API_BASE: ${VK_API_BASE:-https://api.vk.com/method}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      TELEGRAM_SESSION_DIR: ${TELEGRAM_SESSION_DIR:-/data/tg}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
    command: ["sh", "-lc", "python -m app.parsers.telegram_auth"]
    volumes:
      - tgdata:/data/tg
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *backend-image
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://newsint:newsint@db:5432/newsint}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-change-me}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
    command: ["sh", "-lc", "python -m app.workers.scheduler"]
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    logging: *default-logging
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.nginx
      args:
        # Пусто = same-origin /api/… через nginx. Не задавайте /api — пути уже с префиксом /api.
        VITE_API_BASE_URL: "${API_PUBLIC_URL:-}"
    ports:
      - "80:80"
    volumes:
      - storage:/data/storage:ro
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  storage:
  tgdata:
