[project]
name = "news-intelligence-parser"
version = "0.1.0"
description = "News Intelligence Parser backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.1",
  "readability-lxml>=0.8.1",
  "feedparser>=6.0",
  "redis>=5.0",
  "rq>=1.16",
  "tenacity>=8.2",
  "orjson>=3.9",
  "jinja2>=3.1",
  "plotly>=5.20",
  "kaleido>=0.2.1",
  "playwright>=1.42",
  "telethon>=1.34",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "pdfplumber>=0.11",
  "pytesseract>=0.3",
  "Pillow>=10.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.2.2",
]
